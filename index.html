    <script>
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const userDisplayName = document.getElementById('user-display-name');
        const userDisplayRole = document.getElementById('user-display-role');
        const userDisplayGrade = document.getElementById('user-display-grade');
        const userDisplayPoints = document.getElementById('user-display-points');
        const gradeInfoBox = document.getElementById('grade-info-box');
        const pointsInfoBox = document.getElementById('points-info-box');
        const logoutBtn = document.getElementById('logout-btn');
        const roleSelect = document.getElementById('role');
        const gradeGroup = document.getElementById('grade-group');
        const gradeInput = document.getElementById('grade');

        const panelStudent = document.getElementById('panel-student');
        const panelTeacher = document.getElementById('panel-teacher');
        const panelManager = document.getElementById('panel-manager');

        const teacherGradeSection = document.getElementById('teacher-grade-section');
        const teacherHomeworkSection = document.getElementById('teacher-homework-section');
        const teacherAttendanceSection = document.getElementById('teacher-attendance-section');
        const managerMessageSection = document.getElementById('manager-message-section');
        const managerScheduleSection = document.getElementById('manager-schedule-section');
        
        const gradesViewSection = document.getElementById('grades-view-section');
        const scheduleViewSection = document.getElementById('schedule-view-section');
        const homeworkViewSection = document.getElementById('homework-view-section');
        const messagesViewSection = document.getElementById('messages-view-section');
        const examViewSection = document.getElementById('exam-view-section');

        const gradeForm = document.getElementById('grade-form');
        const homeworkForm = document.getElementById('homework-form');
        const attendanceForm = document.getElementById('attendance-form');
        const messageForm = document.getElementById('message-form');
        const scheduleForm = document.getElementById('schedule-form');

        const gradesTableBody = document.getElementById('grades-table-body');
        const scheduleTableBody = document.getElementById('schedule-table-body');
        const homeworkListBox = document.getElementById('homework-list-box');
        const messagesListBox = document.getElementById('messages-list-box');

        function toggleGradeField() {
            if (roleSelect.value === 'دانش‌آموز') {
                gradeGroup.style.display = 'block';
                gradeInput.required = true;
            } else {
                gradeGroup.style.display = 'none';
                gradeInput.required = false;
                gradeInput.value = '';
            }
        }

        function calculateUserPoints(studentName) {
            let grades = JSON.parse(localStorage.getItem('farabi_grades') || '[]');
            let totalPoints = 0;
            grades.forEach(g => {
                if (g.student.trim() === studentName.trim()) {
                    totalPoints += Number(g.points || 0);
                }
            });
            return totalPoints;
        }

        function checkLogin() {
            const savedUser = localStorage.getItem('farabi_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);

                userDisplayName.textContent = user.name;
                userDisplayRole.textContent = user.role;

                if (user.role === 'دانش‌آموز') {
                    if (user.grade) {
                        userDisplayGrade.textContent = user.grade;
                        gradeInfoBox.style.display = 'inline';
                    }
                    userDisplayPoints.textContent = calculateUserPoints(user.name);
                    pointsInfoBox.style.display = 'inline';
                } else {
                    gradeInfoBox.style.display = 'none';
                    pointsInfoBox.style.display = 'none';
                }

                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                closeSubPanels();

                panelStudent.classList.add('hidden');
                panelTeacher.classList.add('hidden');
                panelManager.classList.add('hidden');

                if (user.role === 'دانش‌آموز') {
                    panelStudent.classList.remove('hidden');
                } else if (user.role === 'معلم') {
                    panelTeacher.classList.remove('hidden');
                } else if (user.role === 'مدیر') {
                    panelManager.classList.remove('hidden');
                }
            } else {
                dashboardSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
                toggleGradeField();
            }
        }

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const selectedRole = roleSelect.value;
            const userData = {
                name: document.getElementById('name').value,
                role: selectedRole,
                grade: selectedRole === 'دانش‌آموز' ? gradeInput.value : '',
                nationalCode: document.getElementById('national-code').value
            };
            localStorage.setItem('farabi_user', JSON.stringify(userData));
            checkLogin();
        });

        logoutBtn.addEventListener('click', function() {
            if(confirm('آیا از خروج اطمینان دارید؟')) {
                localStorage.removeItem('farabi_user');
                loginForm.reset();
                checkLogin();
            }
        });

        function openGradeForm() { closeSubPanels(); panelTeacher.classList.add('hidden'); teacherGradeSection.classList.remove('hidden'); }
        function openHomeworkForm() { closeSubPanels(); panelTeacher.classList.add('hidden'); teacherHomeworkSection.classList.remove('hidden'); }
        function openAttendanceForm() { closeSubPanels(); panelTeacher.classList.add('hidden'); teacherAttendanceSection.classList.remove('hidden'); }
        function openMessageForm() { closeSubPanels(); panelManager.classList.add('hidden'); managerMessageSection.classList.remove('hidden'); }
        function openScheduleForm() { closeSubPanels(); panelManager.classList.add('hidden'); managerScheduleSection.classList.remove('hidden'); }

        function showStudentGrades() { closeSubPanels(); panelStudent.classList.add('hidden'); gradesViewSection.classList.remove('hidden'); loadGradesTable(); }
        function showScheduleView() { closeSubPanels(); panelStudent.classList.add('hidden'); panelTeacher.classList.add('hidden'); scheduleViewSection.classList.remove('hidden'); loadScheduleTable(); }
        function showHomeworkStudentView() { closeSubPanels(); panelStudent.classList.add('hidden'); homeworkViewSection.classList.remove('hidden'); loadHomeworkList(); }
        function showMessagesView() { closeSubPanels(); panelStudent.classList.add('hidden'); panelTeacher.classList.add('hidden'); panelManager.classList.add('hidden'); messagesViewSection.classList.remove('hidden'); loadMessagesList(); }
        function showOnlineExamView() { closeSubPanels(); panelStudent.classList.add('hidden'); examViewSection.classList.remove('hidden'); }

        function closeSubPanels() {
            teacherGradeSection.classList.add('hidden');
            teacherHomeworkSection.classList.add('hidden');
            teacherAttendanceSection.classList.add('hidden');
            managerMessageSection.classList.add('hidden');
            managerScheduleSection.classList.add('hidden');
            gradesViewSection.classList.add('hidden');
            scheduleViewSection.classList.add('hidden');
            homeworkViewSection.classList.add('hidden');
            messagesViewSection.classList.add('hidden');
            examViewSection.classList.add('hidden');
            
            const user = JSON.parse(localStorage.getItem('farabi_user') || '{}');
            if (user.role === 'دانش‌آموز') {
                panelStudent.classList.remove('hidden');
            } else if (user.role === 'معلم') {
                panelTeacher.classList.remove('hidden');
            } else if (user.role === 'مدیر') {
                panelManager.classList.remove('hidden');
            }
        }

        gradeForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newGrade = {
                student: document.getElementById('student-name').value,
                subject: document.getElementById('subject-name').value,
                score: document.getElementById('score-val').value,
                points: document.getElementById('points-val').value || 0
            };
            let grades = JSON.parse(localStorage.getItem('farabi_grades') || '[]');
            grades.push(newGrade);
            localStorage.setItem('farabi_grades', JSON.stringify(grades));
            alert('نمره و امتیاز با موفقیت ثبت شد!');
            gradeForm.reset();
            closeSubPanels();
        });

        homeworkForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newHw = {
                subject: document.getElementById('hw-subject').value,
                desc: document.getElementById('hw-desc').value,
                deadline: document.getElementById('hw-deadline').value
            };
            let homeworks = JSON.parse(localStorage.getItem('farabi_homeworks') || '[]');
            homeworks.push(newHw);
            localStorage.setItem('farabi_homeworks', JSON.stringify(homeworks));
            alert('تکلیف جدید با موفقیت منتشر شد!');
            homeworkForm.reset();
            closeSubPanels();
        });

        attendanceForm.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('وضعیت حضور و غیاب دانش‌آموز ثبت شد.');
            attendanceForm.reset();
            closeSubPanels();
        });

        messageForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newMsg = {
                title: document.getElementById('msg-title').value,
                text: document.getElementById('msg-text').value,
                date: 'امروز'
            };
            let messages = JSON.parse(localStorage.getItem('farabi_messages') || '[]');
            messages.push(newMsg);
            localStorage.setItem('farabi_messages', JSON.stringify(messages));
            alert('پیام عمومی با موفقیت ارسال شد!');
            messageForm.reset();
            closeSubPanels();
        });

        scheduleForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newSchedule = {
                day: document.getElementById('schedule-day').value,
                time: document.getElementById('schedule-time').value,
                lesson: document.getElementById('schedule-lesson').value
            };
            let schedules = JSON.parse(localStorage.getItem('farabi_schedules') || '[]');
            schedules.push(newSchedule);
            localStorage.setItem('farabi_schedules', JSON.stringify(schedules));
            alert('برنامه هفتگی با موفقیت ثبت شد!');
            scheduleForm.reset();
            closeSubPanels();
        });

        function submitExam() {
            alert('پاسخنامه شما با موفقیت ارسال شد!');
            closeSubPanels();
        }

        function loadGradesTable() {
            let grades = JSON.parse(localStorage.getItem('farabi_grades') || '[]');
            gradesTableBody.innerHTML = '';
            if (grades.length === 0) {
                gradesTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #64748b;">هنوز نمره یا امتیازی ثبت نشده است.</td></tr>';
                return;
            }
            grades.forEach(g => {
                gradesTableBody.innerHTML += `<tr><td>${g.student}</td><td>${g.subject}</td><td><b>${g.score}</b></td><td><span style="color: #d97706; font-weight: bold;">⭐ +${g.points || 0}</span></td></tr>`;
            });
        }

        function loadScheduleTable() {
            let schedules = JSON.parse(localStorage.getItem('farabi_schedules') || '[]');
            scheduleTableBody.innerHTML = '';
            if (schedules.length === 0) {
                schedules = [
                    { day: 'شنبه', time: '۸:۰۰ الی ۹:۳۰', lesson: 'علوم تجربی (شیمی نهم)' },
                    { day: 'یکشنبه', time: '۸:۰۰ الی ۹:۳۰', lesson: 'ریاضیات' }
                ];
            }
            schedules.forEach(s => {
                scheduleTableBody.innerHTML += `<tr><td>${s.day}</td><td>${s.time}</td><td><b>${s.lesson}</b></td></tr>`;
            });
        }

        function loadHomeworkList() {
            let homeworks = JSON.parse(localStorage.getItem('farabi_homeworks') || '[]');
            homeworkListBox.innerHTML = '';
            if (homeworks.length === 0) {
                homeworkListBox.innerHTML = '<p style="color: #64748b;">در حال حاضر تکلیفی تعریف نشده است.</p>';
                return;
            }
            homeworks.forEach((hw) => {
                homeworkListBox.innerHTML += `
                    <div style="background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px;">
                        <h4>درس: ${hw.subject}</h4>
                        <p style="margin: 5px 0; color: #475569;">${hw.desc}</p>
                        <p style="font-size: 12px; color: #d97706;">مهلت تحویل: ${hw.deadline}</p>
                        <button onclick="alert('تکلیف شما با موفقیت ارسال شد!')" style="width: auto; padding: 6px 14px; font-size: 13px; margin-top: 8px;">ارسال پاسخ تکلیف</button>
                    </div>`;
            });
        }

        function loadMessagesList() {
            let messages = JSON.parse(localStorage.getItem('farabi_messages') || '[]');
            messagesListBox.innerHTML = '';
            if (messages.length === 0) {
                messages = [{ title: 'خوش آمدید', text: 'آغاز سال تحصیلی جدید در سامانه هوشمند مدرسه فارابی مبارک باد.', date: 'مهر ۱۴۰۵' }];
            }
            messages.forEach(m => {
                messagesListBox.innerHTML += `
                    <div style="background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px;">
                        <h4 style="color: var(--dark-blue);">${m.title}</h4>
                        <p style="margin: 5px 0; color: #475569;">${m.text}</p>
                        <span style="font-size: 11px; color: #64748b;">تاریخ: ${m.date}</span>
                    </div>`;
            });
        }

        checkLogin();
    </script>
