<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسه فارابی - سامانه مدیریت دانش‌آموزی</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none !important;
        }

        .dashboard {
            max-width: 800px;
        }

        .welcome-box {
            background: #e0e7ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background-color: #ef4444;
            width: auto;
            padding: 6px 14px;
            font-size: 14px;
            margin-top: 0;
        }

        .logout-btn:hover {
            background-color: #dc2626;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .card h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .card a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .card a:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <!-- فرم ورود -->
    <div id="login-section" class="container">
        <h2>ورود به مدرسه فارابی</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="name">نام و نام خانوادگی:</label>
                <input type="text" id="name" required placeholder="مثلاً: علی رضایی">
            </div>
            <div class="form-group">
                <label for="role">نقش:</label>
                <select id="role">
                    <option value="دانش‌آموز">دانش‌آموز</option>
                    <option value="معلم">معلم</option>
                    <option value="مدیر">مدیر</option>
                </select>
            </div>
            <div class="form-group">
                <label for="grade">پایه تحصیلی:</label>
                <input type="text" id="grade" required placeholder="مثلاً: نهم">
            </div>
            <div class="form-group">
                <label for="national-code">کد ملی:</label>
                <input type="text" id="national-code" required placeholder="کد ملی ۱۰ رقمی">
            </div>
            <button type="submit">ورود به سامانه</button>
        </form>
    </div>

    <!-- داشبورد کاربری -->
    <div id="dashboard-section" class="container dashboard hidden">
        <div class="welcome-box">
            <div>
                <h3>خوش آمدید، <span id="user-display-name"></span> عزیز!</h3>
                <p style="font-size: 14px; margin-top: 4px;">نقش: <span id="user-display-role"></span> | پایه: <span id="user-display-grade"></span></p>
            </div>
            <button class="logout-btn" id="logout-btn">خروج</button>
        </div>

        <h3 style="margin-top: 10px;">امکانات مدرسه</h3>
        <div class="grid">
            <div class="card">
                <h3>کلاس‌های آنلاین</h3>
                <p>ورود به کلاس‌های اسکای‌روم</p>
                <a href="https://www.skyroom.online" target="_blank">ورود به کلاس</a>
            </div>
            <div class="card">
                <h3>کارنامه و نمرات</h3>
                <p>مشاهده وضعیت تحصیلی</p>
                <a href="#" onclick="alert('به زودی فعال می‌شود'); return false;">مشاهده</a>
            </div>
            <div class="card">
                <h3>برنامه هفتگی</h3>
                <p>مشاهده ساعات دروس</p>
                <a href="#" onclick="alert('به زودی فعال می‌شود'); return false;">مشاهده</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const userDisplayName = document.getElementById('user-display-name');
        const userDisplayRole = document.getElementById('user-display-role');
        const userDisplayGrade = document.getElementById('user-display-grade');
        const logoutBtn = document.getElementById('logout-btn');

        // بررسی ذخیره بودن اطلاعات در حافظه مرورگر (localStorage)
        function checkLogin() {
            const savedUser = localStorage.getItem('farabi_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                userDisplayName.textContent = user.name;
                userDisplayRole.textContent = user.role;
                userDisplayGrade.textContent = user.grade;
                
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
            }
        }

        // ثبت‌نام / ورود کاربر
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const userData = {
                name: document.getElementById('name').value,
                role: document.getElementById('role').value,
                grade: document.getElementById('grade').value,
                nationalCode: document.getElementById('national-code').value
            };

            localStorage.setItem('farabi_user', JSON.stringify(userData));
            checkLogin();
        });

        // دکمه خروج
        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('farabi_user');
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            loginForm.reset();
        });

        // اجرای اولیه بررسی ورود هنگام لود صفحه
        checkLogin();
    </script>
</body>
</html>
